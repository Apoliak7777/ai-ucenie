<style>
/* 404 sa zobrazuje na ľubovoľnej adrese, preto sú cesty k písmam aj odkazy absolútne na doménu. */
@font-face{font-family:'Newsreader';font-style:normal;font-weight:500;font-display:swap;src:url('https://aiucenie.online/fonts/newsreader-500-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:500;font-display:swap;src:url('https://aiucenie.online/fonts/newsreader-500-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url('https://aiucenie.online/fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url('https://aiucenie.online/fonts/manrope-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:light dark;
  --bg:#F8F7F4; --surface:#FFFFFF; --ink:#151517; --ink-2:#3A3A3E; --muted:#6E6E74; --line:rgba(21,21,23,.13); --box-line:rgba(21,21,23,.08); --acc:#1F45D8; --acc-hover:#1836B4; --acc-ink:#FFFFFF; --acc-line:rgba(31,69,216,.32); --shadow:0 1px 2px rgba(21,21,23,.06),0 24px 48px -28px rgba(21,21,23,.32);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141416; --surface:#1D1D20; --ink:#EDEBE6; --ink-2:#C9C7C1; --muted:#9A9893; --line:rgba(237,235,230,.15); --box-line:rgba(237,235,230,.10); --acc:#8FA5FF; --acc-hover:#A9B9FF; --acc-ink:#0E1330; --acc-line:rgba(143,165,255,.4); --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 48px -28px rgba(0,0,0,.8)}
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;
  background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6}
main{max-width:520px}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.brand{display:inline-block;text-decoration:none;font-family:var(--display);font-weight:500;font-size:1.06rem;letter-spacing:-.02em;margin-bottom:40px}
.code{font-family:var(--display);font-weight:500;font-size:clamp(4.5rem,16vw,8rem);line-height:.9;letter-spacing:-.05em;margin:0;color:var(--acc)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.022em;line-height:1.1;margin:18px 0 0;text-wrap:balance}
p{color:var(--ink-2);margin:14px 0 0;max-width:44ch;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.cta{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.96rem;
  padding:13px 22px;border-radius:6px;border:1px solid transparent;text-decoration:none;white-space:nowrap;
  background:var(--acc);color:var(--acc-ink);transition:background-color .3s var(--ease),transform .3s var(--ease),border-color .3s var(--ease)}
.cta:hover{background:var(--acc-hover);transform:translateY(-1px)}
.cta:active{transform:scale(.98)}
.cta--line{background:transparent;color:var(--ink);border-color:var(--line)}
.cta--line:hover{background:transparent;border-color:var(--ink)}
</style>
</head>
<body>
  <main>
    <a class="brand" href="https://aiucenie.online/">AI Učenie</a>
    <p class="code">404</p>
    <h1>Táto stránka tu nie je</h1>
    <p>Buď si sa preklikol, alebo som ju presunul. Termín si vieš vybrať na hlavnej stránke.</p>
    <div class="row">
      <a class="cta" href="https://aiucenie.online/#termin">Vybrať termín</a>
      <a class="cta cta--line" href="mailto:info@aiucenie.online">Napísať mi</a>
    </div>
  </main>
</body>
</html>
