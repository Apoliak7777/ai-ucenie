:root{
  color-scheme:light dark;
  --bg:#F4F5F7; --ink:#17191C; --ink-2:#3C4147; --muted:#646B73; --line:rgba(23,25,28,.10);
  --acc:#1D7A4D; --acc-hover:#176640; --acc-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121417; --ink:#ECEEF0; --ink-2:#C9CED4; --muted:#9AA1A9; --line:rgba(236,238,240,.12);
    --acc:#5BC48A; --acc-hover:#74D19D; --acc-ink:#0E1A13}
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;
  background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6}
main{max-width:520px}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.brand{display:inline-block;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.06rem;letter-spacing:-.02em;margin-bottom:40px}
.code{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,16vw,8rem);line-height:.9;letter-spacing:-.05em;margin:0;color:var(--acc)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.022em;line-height:1.1;margin:18px 0 0;text-wrap:balance}
p{color:var(--ink-2);margin:14px 0 0;max-width:44ch;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.cta{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.96rem;
  padding:13px 22px;border-radius:999px;border:1px solid transparent;text-decoration:none;white-space:nowrap;
  background:var(--acc);color:var(--acc-ink);transition:background-color .3s var(--ease),transform .3s var(--ease),border-color .3s var(--ease)}
.cta:hover{background:var(--acc-hover);transform:translateY(-1px)}
.cta:active{transform:scale(.98)}
.cta--line{background:transparent;color:var(--ink);border-color:var(--line)}
.cta--line:hover{background:transparent;border-color:var(--ink)}
</style>
