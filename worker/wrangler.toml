# Cloudflare Worker s rezerváciami (stránka ostáva na GitHub Pages).
# Nasadenie:  npm run api:deploy        Lokálne:  npm run api:dev
# Tajomstvá:  npx wrangler secret put SMTP_HESLO -c worker/wrangler.toml
#             npx wrangler secret put ADMIN_HESLO -c worker/wrangler.toml
name = "ai-ucenie"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "ai-ucenie"
# database_id doplní `npx wrangler d1 create ai-ucenie` (lokálne dev funguje aj s týmto zástupným)
database_id = "00000000-0000-0000-0000-000000000000"
