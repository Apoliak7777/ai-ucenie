<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Zdroj obrázka na zdieľanie odkazu. PNG sa z neho renderuje v prehliadači (fonts/ vedľa). -->
  <style>
    @font-face{font-family:'Bricolage Grotesque';font-weight:200 800;src:url('fonts/bricolage-grotesque-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
    @font-face{font-family:'Bricolage Grotesque';font-weight:200 800;src:url('fonts/bricolage-grotesque-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
    @font-face{font-family:'Manrope';font-weight:200 800;src:url('fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
    @font-face{font-family:'Manrope';font-weight:200 800;src:url('fonts/manrope-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
    .d{font-family:'Bricolage Grotesque','Segoe UI',sans-serif}
    .b{font-family:'Manrope','Segoe UI',sans-serif}
  </style>

  <rect width="1200" height="630" fill="#F4F5F7"/>

  <!-- značka -->
  <text x="88" y="106" class="d" font-size="30" font-weight="700" fill="#17191C" letter-spacing="-.6">AI Učenie</text>

  <!-- nadpis -->
  <text x="88" y="286" class="d" font-size="78" font-weight="800" fill="#17191C" letter-spacing="-2.6">Za jednu hodinu ti AI</text>
  <text x="88" y="368" class="d" font-size="78" font-weight="800" fill="#17191C" letter-spacing="-2.6">začne šetriť celý týždeň</text>
  <rect x="88" y="396" width="120" height="6" rx="3" fill="#1D7A4D"/>

  <text x="88" y="452" class="b" font-size="27" font-weight="500" fill="#3C4147">Zdieľame obrazovku a naučím ťa AI na tvojich vlastných úlohách.</text>

  <!-- cena -->
  <text x="88" y="560" class="d" font-size="72" font-weight="800" fill="#17191C" letter-spacing="-2.8">25 €</text>
  <text x="258" y="558" class="b" font-size="24" font-weight="600" fill="#646B73">za 60 minút, jeden na jedného</text>

  <text x="1112" y="558" class="b" font-size="24" font-weight="600" fill="#646B73" text-anchor="end">ai.apoliak.online</text>
</svg>
