<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Zdroj obrázka na zdieľanie odkazu. PNG sa z neho renderuje v prehliadači (fonts/ vedľa). -->
  <style>
    @font-face{font-family:'Newsreader';font-weight:500;src:url('fonts/newsreader-500-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
    @font-face{font-family:'Newsreader';font-weight:500;src:url('fonts/newsreader-500-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
    @font-face{font-family:'Manrope';font-weight:200 800;src:url('fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
    @font-face{font-family:'Manrope';font-weight:200 800;src:url('fonts/manrope-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
    .d{font-family:'Newsreader',Georgia,serif;font-weight:500}
    .b{font-family:'Manrope','Segoe UI',sans-serif}
  </style>

  <rect width="1200" height="630" fill="#F8F7F4"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1F45D8"/>

  <!-- značka -->
  <text x="88" y="112" class="d" font-size="34" fill="#151517">AI Učenie</text>

  <!-- nadpis -->
  <text x="88" y="300" class="d" font-size="88" fill="#151517" letter-spacing="-1.5">Naučím ťa AI na tvojej</text>
  <text x="88" y="392" class="d" font-size="88" fill="#151517" letter-spacing="-1.5">vlastnej robote.</text>

  <text x="88" y="456" class="b" font-size="27" font-weight="500" fill="#3A3A3E">Jedna hodina online, jeden na jedného, na tvojom maili, tabuľke alebo e-shope.</text>

  <!-- cena -->
  <text x="88" y="562" class="d" font-size="72" fill="#151517" letter-spacing="-2">25 €</text>
  <text x="262" y="558" class="b" font-size="24" font-weight="600" fill="#6E6E74">za 60 minút, bez predplatného</text>

  <text x="1112" y="558" class="b" font-size="24" font-weight="600" fill="#6E6E74" text-anchor="end">aiucenie.online</text>
</svg>
